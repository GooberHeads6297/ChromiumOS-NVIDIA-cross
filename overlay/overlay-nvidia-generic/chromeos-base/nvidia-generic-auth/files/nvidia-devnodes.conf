# Create /dev/nvidia* before Ash starts. nvidia-drm KMS does not create
# nvidiactl/nvidia0; libEGL_nvidia needs them.

description     "nvidia-generic: create NVIDIA character devices"
author          "chromiumos-nvidia-cross"

start on starting ui or started boot-services
task
oom score -100

script
  if [ -x /usr/sbin/create-nvidia-nodes ]; then
    /usr/sbin/create-nvidia-nodes
  elif [ -x /usr/sbin/scripts/create-nvidia-nodes.sh ]; then
    /usr/sbin/scripts/create-nvidia-nodes.sh
  elif [ -x /usr/share/chromiumos-nvidia-cross/scripts/create-nvidia-nodes.sh ]; then
    /usr/share/chromiumos-nvidia-cross/scripts/create-nvidia-nodes.sh
  elif command -v nvidia-modprobe >/dev/null 2>&1; then
    nvidia-modprobe -c 0 -u -m || nvidia-modprobe -c 0 || true
  fi
end script
