# Persistent every-boot RTX → Ash GUI bring-up (no Ubuntu arm flag).
#
# Runs before session_manager starts Chrome. Replaces the need to re-run
# arm-nvidia-auto-debug / debug.sh just to get past splash into login UI.
#
# Install: sudo ./tools/copy-sbin-scripts-to-disk.sh /dev/nvme1n1
# Or:     sudo ./tools/enable-persistent-gui.sh /dev/nvme1n1

description     "nvidia-generic: persistent GPU GUI bring-up before Ash"
author          "chromiumos-nvidia-cross"

start on starting ui
task
oom score -100
normal exit 0

script
  if [ -x /usr/sbin/nvidia-gui-bringup ]; then
    exec /usr/sbin/nvidia-gui-bringup
  elif [ -x /usr/sbin/scripts/nvidia-gui-bringup.sh ]; then
    exec /usr/sbin/scripts/nvidia-gui-bringup.sh
  elif [ -x /usr/share/chromiumos-nvidia-cross/scripts/nvidia-gui-bringup.sh ]; then
    exec /usr/share/chromiumos-nvidia-cross/scripts/nvidia-gui-bringup.sh
  fi
  exit 0
end script
