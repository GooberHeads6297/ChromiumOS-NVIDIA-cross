# Upstart: merge local-account + safe display chrome_dev.conf fragments.

description     "nvidia-generic: apply local-account and display chrome_dev flags"
author          "chromiumos-nvidia-cross"

start on started boot-services
task
oom score -100

script
  CONF=/etc/chrome_dev.conf
  [ -e "$CONF" ] || touch "$CONF"

  if [ -f "$CONF" ] && grep -q 'local-account-ext' "$CONF" 2>/dev/null; then
    sed -i '/local-account-ext/d' "$CONF"
  fi

  # Strip GBM/PRIME env that black-screens Ash. Keep dual GLVND (NVIDIA + Mesa).
  # session_manager ignores __-prefixed names until login_manager is patched,
  # so ui.override + chrome-nvidia-egl is the path that actually sets EGL.
  if [ -f "$CONF" ]; then
    sed -i \
      -e '/^GBM_BACKEND=/d' \
      -e '/^EGL_PLATFORM=/d' \
      -e '/^__NV_PRIME_RENDER_OFFLOAD=/d' \
      -e '/^VK_ICD_FILENAMES=/d' \
      -e '/^GBM_BACKENDS_PATH=/d' \
      "$CONF"
  fi

  merge_one() {
    local src="$1" marker="$2"
    [ -e "$src" ] || return 0
    grep -qF "$marker" "$CONF" 2>/dev/null && return 0
    {
      printf '\n%s\n' "$marker"
      cat "$src"
    } >> "$CONF"
  }

  merge_one /usr/share/chromiumos-nvidia-cross/chrome_dev.conf.auth \
            "# nvidia-generic-auth chrome flags"
  # Drop old display markers so dual-GPU GLVND (v6) is picked up on upgrade.
  if grep -qF "# nvidia-generic-auth display flags v2" "$CONF" 2>/dev/null; then
    sed -i '/# nvidia-generic-auth display flags v2/,/^--ignore-gpu-blocklist$/d' "$CONF" 2>/dev/null || true
  fi
  if grep -qF "# nvidia-generic-auth display flags v3" "$CONF" 2>/dev/null; then
    sed -i '/# nvidia-generic-auth display flags v3/,/^--ignore-gpu-blocklist$/d' "$CONF" 2>/dev/null || true
  fi
  if grep -qF "# nvidia-generic-auth display flags v4" "$CONF" 2>/dev/null; then
    sed -i '/# nvidia-generic-auth display flags v4/,/^--disable-features=Vulkan$/d' "$CONF" 2>/dev/null || true
    sed -i '/# nvidia-generic-auth display flags v4/,/^--ignore-gpu-blocklist$/d' "$CONF" 2>/dev/null || true
  fi
  if grep -qF "# nvidia-generic-auth display flags v5" "$CONF" 2>/dev/null; then
    sed -i '/# nvidia-generic-auth display flags v5/,/^--ignore-gpu-blocklist$/d' "$CONF" 2>/dev/null || true
  fi

  merge_one /usr/share/chromiumos-nvidia-cross/chrome_dev.conf.display \
            "# nvidia-generic-auth display flags v6"
  grep -qF -- '--disable-gpu-sandbox' "$CONF" 2>/dev/null || \
    printf '%s\n' '--disable-gpu-sandbox' >> "$CONF"
end script
