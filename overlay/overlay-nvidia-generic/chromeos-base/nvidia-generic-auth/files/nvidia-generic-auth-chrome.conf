# Upstart: merge offline/local-account Chrome flags into chrome_dev.conf once per boot.

description     "nvidia-generic: apply local-account chrome_dev flags"
author          "chromiumos-nvidia-cross"

start on started boot-services
task
oom score -100

script
  CONF=/etc/chrome_dev.conf
  SRC=/usr/share/chromiumos-nvidia-cross/chrome_dev.conf.auth
  MARKER="# nvidia-generic-auth chrome flags"

  # Only test/dev images ship a writable chrome_dev.conf that login_manager reads.
  [ -e "$SRC" ] || exit 0
  [ -e "$CONF" ] || touch "$CONF"

  # Login --load-extension crashes OOBE into powerwash; strip leftover lines.
  if [ -f "$CONF" ] && grep -q 'local-account-ext' "$CONF" 2>/dev/null; then
    sed -i '/local-account-ext/d' "$CONF"
  fi

  if grep -qF "$MARKER" "$CONF" 2>/dev/null; then
    exit 0
  fi

  {
    printf '\n%s\n' "$MARKER"
    cat "$SRC"
  } >> "$CONF"
end script
