# First-boot local-account + disk-install HTTP UI (http://127.0.0.1:17891/).

description     "nvidia-generic local account and install UI"
author          "chromiumos-nvidia-cross"

start on started boot-services
stop on stopping boot-services
respawn
respawn limit 3 30
oom score -50

env PYTHONUNBUFFERED=1

pre-start script
  MARKER=/var/lib/nvidia-generic-auth/local-account-setup.done
  root_src="$(findmnt -no SOURCE / 2>/dev/null || true)"
  pk=""
  if [ -n "$root_src" ]; then
    pk="$(lsblk -no PKNAME "$root_src" 2>/dev/null | head -1)"
    [ -n "$pk" ] || pk="$(basename "$root_src")"
  fi
  removable=1
  if [ -n "$pk" ] && [ -f "/sys/block/${pk}/removable" ]; then
    removable="$(cat "/sys/block/${pk}/removable" 2>/dev/null || echo 1)"
  fi
  # USB live: always keep the installer. Installed disk: stop after password UI is done.
  if [ "$removable" != "1" ] && [ -f "$MARKER" ]; then
    stop
    exit 0
  fi
end script

post-start script
  logger -t nvidia-generic-auth "Local setup UI: http://127.0.0.1:17891/"
  printf '%s\n' "Local setup UI: http://127.0.0.1:17891/" > /dev/tty2 2>/dev/null || true
end script

exec /usr/bin/python3 /usr/share/chromiumos-nvidia-cross/local-account-setup.py
