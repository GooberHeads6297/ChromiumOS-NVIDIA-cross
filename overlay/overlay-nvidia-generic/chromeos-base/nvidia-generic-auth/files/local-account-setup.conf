# First-boot local-account HTTP UI (http://127.0.0.1:17891/).

description     "nvidia-generic local account setup UI"
author          "chromiumos-nvidia-cross"

start on started boot-services
stop on stopping boot-services
respawn
respawn limit 3 30
oom score -50

env PYTHONUNBUFFERED=1

pre-start script
  # Skip once a local account has been created via this UI.
  if [ -f /var/lib/nvidia-generic-auth/local-account-setup.done ]; then
    stop
    exit 0
  fi
  # If any cryptohome shadow user already exists, do not advertise setup.
  if ls /home/.shadow/*/mount >/dev/null 2>&1 || \
     ls -d /home/.shadow/*-* >/dev/null 2>&1; then
    # Still allow the server if only salt/system dirs exist; only skip when
    # obfuscated user dirs (hex) are present.
    for d in /home/.shadow/*; do
      [ -d "$d" ] || continue
      base="$(basename "$d")"
      case "$base" in
        salt|install_attributes.pb) continue ;;
      esac
      if [ "${#base}" -ge 16 ]; then
        stop
        exit 0
      fi
    done
  fi
end script

exec /usr/bin/python3 /usr/share/chromiumos-nvidia-cross/local-account-setup.py
