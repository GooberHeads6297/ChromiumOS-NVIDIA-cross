# Headless Stage-3 debug: no VT2 login required.
#
# From Ubuntu (disk idle):
#   sudo ./tools/arm-nvidia-auto-debug.sh /dev/nvme1n1
# Boot CrOS, wait ~90s (Chrome logo / black is fine), power off, then:
#   sudo ./tools/pull-nvidia-debug-logs.sh /dev/nvme1n1 && ./tools/verify-modeset-from-logs.sh
#
# Flags on H-STATE unencrypted/:
#   nvidia-auto-debug     one-shot: run nvidia-generic-debug, then delete flag
#   nvidia-hold-ui        keep Ash stopped so Ctrl-Alt-F2 login stays usable
#                         (delete the file or reboot without it to resume UI)

description     "nvidia-generic: headless auto-debug / UI hold (flag file)"
author          "chromiumos-nvidia-cross"

start on started boot-services or starting ui
task
oom score -100
normal exit 0

script
  STATE_UNENC=/mnt/stateful_partition/unencrypted
  FLAG_DEBUG="${STATE_UNENC}/nvidia-auto-debug"
  FLAG_HOLD="${STATE_UNENC}/nvidia-hold-ui"
  LOG="${STATE_UNENC}/nvidia-auto-debug-upstart.log"
  RUNMARK=/run/nvidia-generic-auto-debug.ran

  # Upstart may fire twice (boot-services + starting ui); run once per boot.
  if [ -e "$RUNMARK" ]; then
    exit 0
  fi
  mkdir -p /run 2>/dev/null || true
  : >"$RUNMARK"

  mkdir -p "$STATE_UNENC" 2>/dev/null || true
  {
    echo "==== nvidia-generic-auto-debug $(date -u +%Y-%m-%dT%H:%M:%SZ) ===="
    echo "FLAG_DEBUG=$( [ -f "$FLAG_DEBUG" ] && echo yes || echo no )"
    echo "FLAG_HOLD=$( [ -f "$FLAG_HOLD" ] && echo yes || echo no )"
  } >>"$LOG" 2>&1

  [ -f "$FLAG_DEBUG" ] || [ -f "$FLAG_HOLD" ] || exit 0

  # Wait for stateful (boot-services can race the NVMe mount).
  i=0
  while [ "$i" -lt 60 ]; do
    [ -d /mnt/stateful_partition/unencrypted ] && break
    i=$((i + 1))
    sleep 1
  done

  if [ -f "$FLAG_HOLD" ] || [ -f "$FLAG_DEBUG" ]; then
    stop ui 2>>"$LOG" || true
    echo "ui stopped for hold/auto-debug" >>"$LOG"
  fi

  if [ -f "$FLAG_HOLD" ] && [ ! -f "$FLAG_DEBUG" ]; then
    # Interactive VT2 window: keep UI down until flag removed or 3 minutes.
    echo "hold-ui: waiting up to 180s for flag removal (Ctrl-Alt-F2 now)" >>"$LOG"
    j=0
    while [ -f "$FLAG_HOLD" ] && [ "$j" -lt 180 ]; do
      j=$((j + 1))
      sleep 1
    done
    rm -f "$FLAG_HOLD" 2>/dev/null || true
    start ui 2>>"$LOG" || true
    echo "hold-ui: done, ui restarted" >>"$LOG"
    exit 0
  fi

  if [ -f "$FLAG_DEBUG" ]; then
    # One-shot: consume flag immediately so a crash/reboot does not loop forever.
    rm -f "$FLAG_DEBUG"
    echo "auto-debug: flag consumed, waiting for /dev/dri/card2" >>"$LOG"
    i=0
    while [ "$i" -lt 45 ]; do
      [ -e /dev/dri/card2 ] && break
      i=$((i + 1))
      sleep 1
    done
    if [ -x /usr/sbin/create-nvidia-nodes ]; then
      /usr/sbin/create-nvidia-nodes >>"$LOG" 2>&1 || true
    fi
    DBG=""
    if [ -x /usr/sbin/nvidia-generic-debug ]; then
      DBG=/usr/sbin/nvidia-generic-debug
    elif [ -x /usr/sbin/scripts/debug.sh ]; then
      DBG=/usr/sbin/scripts/debug.sh
    fi
    if [ -n "$DBG" ]; then
      echo "auto-debug: exec $DBG" >>"$LOG"
      NVIDIA_AUTO_DEBUG=1 "$DBG" >>"$LOG" 2>&1 || echo "auto-debug: exit=$?" >>"$LOG"
    else
      echo "auto-debug: FATAL no nvidia-generic-debug on rootfs" >>"$LOG"
    fi
    rm -f "$FLAG_HOLD" 2>/dev/null || true
    echo "auto-debug: finished $(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$LOG"
  fi
end script
