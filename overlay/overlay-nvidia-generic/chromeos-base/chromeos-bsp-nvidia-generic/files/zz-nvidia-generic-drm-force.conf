# tmpfiles.d bring-up companion to 99-nvidia-generic-drm-force.rules.
# Sorts after nvidia-generic-drm-acl.conf, so these modes win.

z /dev/dri/card*          0666 root video - -
z /dev/dri/renderD*       0666 root video - -
z /dev/nvidia[0-9]*       0666 root video - -
z /dev/nvidiactl          0666 root video - -
z /dev/nvidia-modeset     0666 root video - -
z /dev/nvidia-uvm         0666 root video - -
z /dev/nvidia-uvm-tools   0666 root video - -
