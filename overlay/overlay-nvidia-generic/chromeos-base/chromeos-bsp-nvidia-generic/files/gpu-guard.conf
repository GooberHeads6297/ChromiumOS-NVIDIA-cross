# /etc/init/gpu-guard.conf -- upstart job for the GPU thermal watchdog.
#
# Starts once the NVIDIA character device exists, which means the driver has loaded and
# nvidia-smi can actually be queried. Starting earlier would just fail in a loop.

description     "NVIDIA GPU thermal and power watchdog"
author          "ChromiumOS-NVIDIA-cross"

# system-services implies the boot has reached a usable state.
start on started system-services
stop on stopping system-services

# The guard is a safety device: if it dies, restart it. If it cannot stay up, that is
# itself worth knowing, so the limit is finite rather than infinite.
respawn
respawn limit 10 60

# ChromeOS rejects an upstart job with no oom clause. This is the thermal backstop,
# so the OOM killer must not take it while Chrome is the thing consuming memory.
oom score never

# Needs root to read nvidia-smi control interfaces, apply the power cap and, in the
# worst case, power the machine off.
exec /usr/share/chromiumos-nvidia-cross/gpu-guard.sh

pre-start script
    # Do not start if the driver has not produced a device node. This is the normal
    # state during Stage 1 (no NVIDIA stack) and while the module is blacklisted, so it
    # is a clean exit rather than an error.
    if [ ! -e /dev/nvidia0 ]; then
        logger -t gpu-guard "no /dev/nvidia0; not starting watchdog"
        stop
        exit 0
    fi
end script

post-stop script
    logger -t gpu-guard "watchdog stopped"
end script
