# /etc/init/release-nvidia-drm-master.conf
#
# fbdev=1 lets splash/VT prove the RTX path. fbcon then holds DRM master and
# minigbm's dumb probe gets EACCES (Permission denied) on nvidia-drm.
# Unbind framebuffer vtconsoles before Chrome so Ash can drmSetMaster.

description     "nvidia-generic: release fbcon DRM master before Ash"
author          "chromiumos-nvidia-cross"

start on starting ui
task
oom score -100

exec /usr/share/chromiumos-nvidia-cross/release-nvidia-drm-master.sh
