# /etc/modprobe.d/zz-nvidia-generic-modeset.conf
# Sorts after nvidia-open-drivers' nvidia-modeset.conf.
# Do not install as nvidia-modeset.conf — that path belongs to nvidia-open-drivers.
# fbdev=1: NVIDIA fbcon/splash so a working GUI path is visible immediately.

options nvidia-drm modeset=1 fbdev=1
