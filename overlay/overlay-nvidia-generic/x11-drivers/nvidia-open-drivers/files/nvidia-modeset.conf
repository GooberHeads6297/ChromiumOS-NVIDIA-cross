# /etc/modprobe.d/nvidia-modeset.conf
#
# Dual-output default for nvidia-generic.
#
#   - Motherboard / Raphael iGPU (amdgpu): keeps the text console and debug path.
#   - RTX 4070 Ti SUPER (nvidia-drm): modesets and provides an fbdev console so
#     GUI / DRM discovery can run on a monitor plugged into the card.
#
# BIOS primary display must stay on the iGPU, with one monitor on the motherboard
# and one on the RTX. That way a bad NVIDIA modeset cannot take away the recovery
# console.
#
# To fall back to driver-only bring-up with no NVIDIA display (old Stage 2):
#   options nvidia-drm modeset=0

options nvidia-drm modeset=1 fbdev=1
