# /etc/modprobe.d/nvidia-modeset-off.conf
#
# STAGE 2 CONFIGURATION -- the safe default.
#
# With modeset=0 the NVIDIA driver loads completely and the GPU is fully usable for
# compute and rendering, but it registers no KMS device and drives no display. The iGPU
# keeps the console.
#
# This is deliberately the default, because it separates two failures that are easy to
# confuse:
#
#   "the driver does not work"        -> visible as nvidia-smi failing
#   "the display path does not work"  -> visible as a black screen
#
# Debugging the first while the second can lock you out of the machine is unpleasant.
# So Stage 2 proves the driver with a guaranteed-working console, and only then does
# Stage 3 hand the display over.
#
# To advance to Stage 3, set modeset=1 (and fbdev=1 so the driver provides a
# framebuffer console):
#
#   options nvidia-drm modeset=1 fbdev=1
#
# Then reboot with a monitor attached to the RTX. Keep a monitor on the iGPU as well
# until the NVIDIA path is proven.

options nvidia-drm modeset=0
