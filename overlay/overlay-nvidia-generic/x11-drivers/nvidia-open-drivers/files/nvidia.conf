# /etc/modprobe.d/nvidia.conf -- NVIDIA module options for the nvidia-generic board.

# Explicit load order. modprobe derives this from symbol dependencies anyway, but
# stating it makes the chain obvious when debugging a partial load.
softdep nvidia post: nvidia-modeset nvidia-uvm

# Nouveau must never bind the card at the same time as nvidia. It is kept in the image
# as a diagnostic fallback (to prove PCI enumeration and DRM/KMS independently), so it
# is blacklisted rather than removed. To use it deliberately, blacklist nvidia instead.
blacklist nouveau
blacklist nvidiafb

# Let the driver create device nodes itself where possible. ChromeOS does not run
# nvidia-modprobe setuid at login the way a desktop distro does.
options nvidia NVreg_ModifyDeviceFiles=1

# Preserve video memory across suspend by writing it to disk rather than relying on the
# GPU keeping it powered. Slower to resume, but markedly more reliable on a driver stack
# we are still bringing up.
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_TemporaryFilePath=/var/tmp

# Leave the power limit and clocks alone here. They are set explicitly by
# safety/gpu-guard.sh, which validates them against the card's stock envelope first.
# Setting them in two places would make it unclear which one won.
