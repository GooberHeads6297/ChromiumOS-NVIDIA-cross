# Board overlay for nvidia-generic.
#
# Modelled on overlay-amd64-generic's own layout.conf, with amd64-generic added as a
# master so this board is a derivative of it rather than a fresh port. Everything
# amd64-generic provides is inherited; this overlay only adds the NVIDIA pieces.
cache-format = md5-dict
eapis-banned = 0 1 2 3 4 5 6
masters = portage-stable chromiumos eclass-overlay amd64-generic
profile-formats = portage-2 profile-default-eapi
profile_eapi_when_unspecified = 5-progress
repo-name = nvidia-generic
thin-manifests = true
use-manifests = strict
