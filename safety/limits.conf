# safety/limits.conf -- single source of truth for every GPU guardrail.
#
# Sourced by safety/gpu-guard.sh, safety/preflight.sh and safety/vbios-backup.sh.
# Shell-sourceable key=value only: no command substitution, no logic.
#
# All values below were measured on the target card, not guessed. See docs/hardware.md.
# Reference readings from `nvidia-smi -q -d TEMPERATURE` and `--query-gpu`:
#
#   Card                RTX 4070 Ti SUPER (AD103, 10de:2705)
#   VBIOS               95.03.45.80.6B
#   Power limit         285 W default, 100 W min, 314 W max
#   Hardware slowdown   92 C   <- enforced in silicon, not by us
#   Hardware shutdown   97 C   <- enforced in silicon, not by us
#   Max operating       90 C
#   Target temperature  84 C
#   Idle reference      18.8 W / 41 C / fan 0% / 345 MHz
#
# Every threshold here sits *below* the hardware slowdown point. The hardware is
# the real backstop; this file only decides when we stop before the hardware has to.

# ---------------------------------------------------------------------------
# Device identity. The guard refuses to run against a different card so that a
# reseated or replaced GPU can never silently inherit thresholds tuned for AD103.
# ---------------------------------------------------------------------------
GPU_PCI_ADDR=0000:01:00.0
GPU_PCI_ID=10de:2705
GPU_EXPECT_NAME="NVIDIA GeForce RTX 4070 Ti SUPER"

# Integrated GPU that must remain the primary display during bring-up. As long as
# the iGPU owns the console, a broken NVIDIA modeset cannot lock us out.
IGPU_PCI_ADDR=0000:0d:00.0
IGPU_DRIVER=amdgpu

# ---------------------------------------------------------------------------
# Version pin. Kernel module, userspace libraries and GSP firmware must all agree
# exactly or the module refuses to load.
# ---------------------------------------------------------------------------
NVIDIA_DRIVER_VERSION=595.91.07
NVIDIA_GSP_FIRMWARE=gsp_ga10x.bin

# ---------------------------------------------------------------------------
# Thermal ladder. Each step is confirmed over CONFIRM_SAMPLES consecutive polls
# before it fires, so a single glitched read can never trigger an action.
# ---------------------------------------------------------------------------
TEMP_WARN=78
TEMP_SOFT=83
TEMP_HARD=87
TEMP_CRITICAL=90

# ---------------------------------------------------------------------------
# Fan-stall detection. This is the one software-reachable state that can actually
# damage hardware, so it gets its own ladder.
#
# This card idles with fans fully stopped (zero-RPM mode) -- 0% fan at 41 C is
# CORRECT and must not trip anything. A stall only matters once the card is hot
# enough that the fans should have spun up. Hence: fan == 0 AND temp >= this.
# ---------------------------------------------------------------------------
FAN_STALL_TEMP=70
FAN_STALL_CONFIRM=10

# ---------------------------------------------------------------------------
# Conservative caps applied during bring-up while the driver path is unproven.
# Both sit inside the card's own legal range; we never raise anything above stock.
#
#   POWER_CAP_W  must be within [100, 314]. 200 W trades a little performance for
#                markedly lower transient load on the VRM while we are debugging.
#   CLOCK_CEIL   stock max graphics clock is 3120 MHz. 2100 damps boost spikes.
#                Never set this above stock.
# ---------------------------------------------------------------------------
POWER_CAP_W=200
CLOCK_CEIL_MHZ=2100

# Measured stock values, recorded so scripts can assert we never exceed them.
POWER_STOCK_W=285
POWER_MAX_W=314
POWER_MIN_W=100
CLOCK_STOCK_MAX_MHZ=3120

# ---------------------------------------------------------------------------
# Guard behaviour.
# ---------------------------------------------------------------------------
POLL_INTERVAL=1
CONFIRM_SAMPLES=3
GUARD_LOG=/var/log/gpu-guard.log

# Disks the bare-metal installer is allowed to touch. Ubuntu lives on sda, which
# is deliberately absent and is hard-blocked in tools/flash.sh.
ALLOWED_TARGET_DISKS="sdb nvme1n1"
FORBIDDEN_TARGET_DISKS="sda"
